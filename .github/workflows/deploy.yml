name: Deploy to EC2

# Production deploy ONLY from main.
# Pushing to develop (or any other branch) will NOT deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Manual runs should still target main; the job guard below enforces this.

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ZYLEARN to EC2
    # Extra safety: never deploy unless the workflow is running on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate required GitHub secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          set -euo pipefail
          missing=0
          check_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error title=Missing secret ${name}::Create repository secret '${name}' under Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "OK — secret '${name}' is configured (value hidden)."
            fi
          }
          check_secret "EC2_HOST" "${EC2_HOST}"
          check_secret "EC2_USER" "${EC2_USER}"
          check_secret "EC2_SSH_KEY" "${EC2_SSH_KEY}"
          check_secret "EC2_APP_PATH" "${EC2_APP_PATH}"
          if [ "$missing" -ne 0 ]; then
            echo "Fix: add the missing secrets, then re-run this workflow."
            exit 1
          fi

      # ── 1) SSH connection test ──────────────────────────────────────────
      - name: SSH connection test
        id: ssh_test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: SSH connection test"
            echo "COMMAND: whoami"
            whoami
            echo "COMMAND: hostname"
            hostname
            echo "COMMAND: date -u"
            date -u
            echo "SSH connection OK"

      # ── 2) Tooling versions (Node / npm / Git / PM2) ─────────────────────
      - name: Check Node.js / npm / Git / PM2 versions
        id: check_tools
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: Check tooling versions"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "$NVM_DIR/nvm.sh"
              echo "Loaded nvm from $NVM_DIR/nvm.sh"
            else
              echo "nvm not found at $HOME/.nvm (using system PATH)"
            fi

            echo "COMMAND: whoami"
            whoami
            echo "COMMAND: pwd"
            pwd
            echo "COMMAND: echo PATH"
            echo "$PATH"

            echo "COMMAND: command -v node"
            if ! command -v node >/dev/null 2>&1; then
              echo "::error::FAILED command: node -v"
              echo "FIX: Install Node.js 20+ for user ubuntu (nvm or NodeSource), then re-login and re-run."
              exit 1
            fi
            echo "COMMAND: node -v"
            node -v

            echo "COMMAND: command -v npm"
            if ! command -v npm >/dev/null 2>&1; then
              echo "::error::FAILED command: npm -v"
              echo "FIX: Install npm alongside Node.js for user ubuntu."
              exit 1
            fi
            echo "COMMAND: npm -v"
            npm -v

            echo "COMMAND: command -v git"
            if ! command -v git >/dev/null 2>&1; then
              echo "::error::FAILED command: git --version"
              echo "FIX: sudo apt-get install -y git"
              exit 1
            fi
            echo "COMMAND: git --version"
            git --version

            echo "COMMAND: command -v pm2"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "::error::FAILED command: pm2 -v"
              echo "FIX: npm install -g pm2  (as ubuntu, no sudo npm for project installs)"
              exit 1
            fi
            echo "COMMAND: pm2 -v"
            pm2 -v
            echo "Tooling check OK"

      # ── 3) Application directory + package files ────────────────────────
      - name: Check application directory and package files
        id: check_app_dir
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check application directory"
            echo "APP_PATH length (hidden value): ${#APP_PATH}"

            if [ -z "${APP_PATH}" ]; then
              echo "::error::FAILED: EC2_APP_PATH secret is empty"
              echo "FIX: Set GitHub secret EC2_APP_PATH=/var/www/ZYLEARN"
              exit 1
            fi

            echo "COMMAND: test -d \"\$APP_PATH\""
            if [ ! -d "${APP_PATH}" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH"
              echo "FIX: Create/clone the app on EC2, then: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN"
              exit 1
            fi
            echo "Directory exists"

            echo "COMMAND: test -f \"\$APP_PATH/package.json\""
            if [ ! -f "${APP_PATH}/package.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package.json"
              echo "FIX: Ensure the React repo is cloned into EC2_APP_PATH"
              exit 1
            fi
            echo "package.json exists"

            echo "COMMAND: test -f \"\$APP_PATH/package-lock.json\""
            if [ ! -f "${APP_PATH}/package-lock.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package-lock.json"
              echo "FIX: Commit package-lock.json on main (required for npm ci)"
              exit 1
            fi
            echo "package-lock.json exists"

            echo "COMMAND: test -d \"\$APP_PATH/.git\""
            if [ ! -d "${APP_PATH}/.git" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH/.git"
              echo "FIX: git clone the GitHub repo into EC2_APP_PATH once"
              exit 1
            fi
            echo "Git repository exists"

            echo "COMMAND: ls -la package.json package-lock.json"
            ls -la "${APP_PATH}/package.json" "${APP_PATH}/package-lock.json"
            echo "Application directory check OK"

      # ── 4) Git status + pull latest main ────────────────────────────────
      - name: Check Git status and pull latest main
        id: git_pull
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          envs: APP_PATH,GIT_SHA
          script: |
            set -e
            echo "STEP: Git fetch / reset"
            cd "${APP_PATH}"
            echo "COMMAND: pwd"
            pwd
            echo "COMMAND: whoami"
            whoami

            echo "COMMAND: git status -sb"
            git status -sb
            echo "COMMAND: git rev-parse HEAD"
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Previous commit: ${PREV_SHA}"
            echo "Target GitHub commit: ${GIT_SHA}"

            echo "COMMAND: git fetch origin main"
            if ! git fetch origin main; then
              echo "::error::FAILED command: git fetch origin main"
              echo "FIX: On EC2 as ubuntu, configure GitHub auth (deploy key or SSH remote)."
              echo "  cd \$APP_PATH && git remote -v"
              echo "  Test: git ls-remote origin main"
              exit 1
            fi

            echo "COMMAND: git reset --hard origin/main"
            if ! git reset --hard origin/main; then
              echo "::error::FAILED command: git reset --hard origin/main"
              echo "FIX: Ensure ubuntu owns the files: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN"
              exit 1
            fi

            echo "COMMAND: git rev-parse HEAD"
            DEPLOY_SHA="$(git rev-parse HEAD)"
            echo "Now at commit: ${DEPLOY_SHA}"
            echo "COMMAND: git status -sb"
            git status -sb
            echo "Git pull OK"
            # Persist previous SHA for later steps via a local file (same host)
            echo "${PREV_SHA}" > /tmp/zylearn_prev_sha
            echo "${DEPLOY_SHA}" > /tmp/zylearn_deploy_sha

      # ── 5) npm ci ───────────────────────────────────────────────────────
      - name: npm ci
        id: npm_ci
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm ci"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${APP_PATH}"
            echo "COMMAND: pwd && node -v && npm -v"
            pwd
            node -v
            npm -v

            echo "COMMAND: npm ci"
            if ! npm ci; then
              echo "::error::FAILED command: npm ci"
              echo "FIX:"
              echo "  1) Ensure package-lock.json matches package.json on main"
              echo "  2) On EC2: cd /var/www/ZYLEARN && rm -rf node_modules && npm ci"
              echo "  3) Check disk space: df -h"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "npm ci OK — PM2 not restarted yet"

      # ── 6) npm run build ────────────────────────────────────────────────
      - name: npm run build
        id: npm_build
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm run build"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd "${APP_PATH}"
            echo "COMMAND: pwd && node -v && npm -v"
            pwd
            node -v
            npm -v

            echo "COMMAND: npm run build"
            if ! npm run build; then
              echo "::error::FAILED command: npm run build"
              echo "FIX:"
              echo "  1) Run locally: npm ci && npm run build"
              echo "  2) Fix TypeScript/Vite errors shown above"
              echo "  3) On EC2: cd /var/www/ZYLEARN && npm run build"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "npm run build OK — PM2 not restarted yet"

      # ── 7) Check dist/ ──────────────────────────────────────────────────
      - name: Check dist directory
        id: check_dist
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check dist directory"
            cd "${APP_PATH}"

            echo "COMMAND: test -d dist"
            if [ ! -d dist ]; then
              echo "::error::FAILED command: test -d dist"
              echo "FIX: Vite should output dist/. Check vite.config and rebuild."
              echo "PM2 was NOT restarted."
              exit 1
            fi

            echo "COMMAND: test -f dist/index.html"
            if [ ! -f dist/index.html ]; then
              echo "::error::FAILED command: test -f dist/index.html"
              echo "FIX: Build did not produce dist/index.html — inspect Vite build output."
              echo "PM2 was NOT restarted."
              exit 1
            fi

            echo "COMMAND: ls -la dist | head -n 30"
            ls -la dist | head -n 30
            echo "dist/ check OK — PM2 not restarted yet"

      # ── 8) Check PM2 process ────────────────────────────────────────────
      - name: Check PM2 process ZYLEARN
        id: check_pm2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check PM2 process"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "COMMAND: pm2 -v"
            pm2 -v
            echo "COMMAND: pm2 status"
            pm2 status

            echo "COMMAND: pm2 describe ZYLEARN"
            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "PM2 process ZYLEARN exists"
              pm2 describe ZYLEARN | head -n 40
              echo "exists" > /tmp/zylearn_pm2_mode
            else
              echo "PM2 process ZYLEARN does NOT exist yet"
              cd "${APP_PATH}"
              if [ -f ecosystem.config.cjs ]; then
                echo "Found ecosystem.config.cjs — will start from it (no duplicate invent)"
                echo "ecosystem_cjs" > /tmp/zylearn_pm2_mode
              elif [ -f ecosystem.config.js ]; then
                echo "Found ecosystem.config.js — will start from it (no duplicate invent)"
                echo "ecosystem_js" > /tmp/zylearn_pm2_mode
              else
                echo "::error::FAILED: PM2 process ZYLEARN missing and no ecosystem.config.js/.cjs"
                echo "FIX (one-time on EC2, do not create duplicates):"
                echo "  cd /var/www/ZYLEARN"
                echo "  # start your existing serve/preview command under name ZYLEARN, e.g. via ecosystem file"
                echo "  pm2 status"
                exit 1
              fi
            fi
            echo "PM2 pre-check OK"

      # ── 9) pm2 restart / start (ONLY after successful build) ────────────
      - name: pm2 restart ZYLEARN
        id: pm2_restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 3m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: pm2 restart/start ZYLEARN"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${APP_PATH}"

            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "COMMAND: pm2 restart ZYLEARN --update-env"
              if ! pm2 restart ZYLEARN --update-env; then
                echo "::error::FAILED command: pm2 restart ZYLEARN --update-env"
                echo "FIX: pm2 logs ZYLEARN --lines 100"
                exit 1
              fi
            elif [ -f ecosystem.config.cjs ]; then
              echo "COMMAND: pm2 start ecosystem.config.cjs"
              if ! pm2 start ecosystem.config.cjs; then
                echo "::error::FAILED command: pm2 start ecosystem.config.cjs"
                exit 1
              fi
            elif [ -f ecosystem.config.js ]; then
              echo "COMMAND: pm2 start ecosystem.config.js"
              if ! pm2 start ecosystem.config.js; then
                echo "::error::FAILED command: pm2 start ecosystem.config.js"
                exit 1
              fi
            else
              echo "::error::FAILED: cannot restart/start ZYLEARN"
              exit 1
            fi
            echo "PM2 restart/start issued OK"

      # ── 10) Verify PM2 status ───────────────────────────────────────────
      - name: Verify PM2 status
        id: pm2_verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: Verify PM2 status"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            sleep 3
            echo "COMMAND: pm2 status ZYLEARN"
            pm2 status ZYLEARN

            echo "COMMAND: pm2 jlist | node (status === online)"
            if ! pm2 jlist | node -e '
              const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const app = data.find((p) => p.name === "ZYLEARN");
              if (!app) {
                console.error("FAILED: ZYLEARN not found in pm2 jlist");
                process.exit(1);
              }
              const status = app.pm2_env && app.pm2_env.status;
              console.log("ZYLEARN status:", status);
              if (status !== "online") {
                console.error("FAILED: expected status online, got:", status);
                process.exit(1);
              }
            '; then
              echo "::error::FAILED command: verify pm2 status online for ZYLEARN"
              echo "FIX: pm2 logs ZYLEARN --lines 100"
              echo "     curl -I http://127.0.0.1:3000"
              exit 1
            fi

            echo "Deployment completed successfully."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## ZYLEARN deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Job status | \`${{ job.status }}\` |"
            echo "| SSH test | \`${{ steps.ssh_test.outcome }}\` |"
            echo "| Tools check | \`${{ steps.check_tools.outcome }}\` |"
            echo "| App dir check | \`${{ steps.check_app_dir.outcome }}\` |"
            echo "| Git pull | \`${{ steps.git_pull.outcome }}\` |"
            echo "| npm ci | \`${{ steps.npm_ci.outcome }}\` |"
            echo "| npm build | \`${{ steps.npm_build.outcome }}\` |"
            echo "| dist check | \`${{ steps.check_dist.outcome }}\` |"
            echo "| PM2 check | \`${{ steps.check_pm2.outcome }}\` |"
            echo "| PM2 restart | \`${{ steps.pm2_restart.outcome }}\` |"
            echo "| PM2 verify | \`${{ steps.pm2_verify.outcome }}\` |"
            echo ""
            echo "Open the **first failed step** above — the log line starting with \`FAILED command:\` is the exact failing command."
            echo "Secrets are never printed."
          } >> "$GITHUB_STEP_SUMMARY"
