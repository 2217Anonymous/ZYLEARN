name: Deploy to EC2

# Production deploy ONLY from main.
# Architecture: SSH to EC2 → NVM → Node.js 25.9.0 → npm ci/build → pm2 restart ZYLEARN
# Pushing to develop (or any other branch) will NOT deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_PIN: "25.9.0"

jobs:
  deploy:
    name: Deploy ZYLEARN to EC2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate required GitHub secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          set -euo pipefail
          missing=0
          check_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error title=Missing secret ${name}::Create repository secret '${name}' under Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "OK — secret '${name}' is configured (value hidden)."
            fi
          }
          check_secret "EC2_HOST" "${EC2_HOST}"
          check_secret "EC2_USER" "${EC2_USER}"
          check_secret "EC2_SSH_KEY" "${EC2_SSH_KEY}"
          check_secret "EC2_APP_PATH" "${EC2_APP_PATH}"
          if [ "$missing" -ne 0 ]; then
            echo "Fix: add the missing secrets, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets are present. Continuing deployment..."

      - name: Checkout repository (for Node pin / npm cache)
        uses: actions/checkout@v4

      - name: Setup Node.js 25.9.0 (GitHub runner)
        uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
          cache: npm

      - name: Verify GitHub runner Node.js 25.9.0
        run: |
          set -euo pipefail
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          if [ "$(node -v)" != "v25.9.0" ]; then
            echo "::error::ERROR: Expected Node.js v25.9.0 on the GitHub runner. Found: $(node -v)"
            exit 1
          fi
          if [ -f .nvmrc ]; then
            echo ".nvmrc:"
            cat .nvmrc
          fi
          echo "GitHub runner Node.js 25.9.0 OK"

      # ── 1) SSH connection test ──────────────────────────────────────────
      - name: SSH connection test
        id: ssh_test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: SSH connection test"
            whoami
            hostname
            date -u
            echo "SSH connection OK"

      # ── 2) Load NVM + verify Node.js 25.9.0 (no auto-install) ───────────
      - name: Ensure Node.js 25.9.0 on EC2 via NVM
        id: check_tools
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            echo "STEP: Load NVM and use Node.js 25.9.0"
            whoami
            pwd

            echo "Loading NVM..."
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "::error::ERROR: NVM is not installed for the deployment user."
              echo "FIX (one-time on EC2 as ubuntu):"
              echo "  curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
              echo "  . \"\$HOME/.nvm/nvm.sh\""
              echo "  nvm install 25.9.0"
              echo "  nvm alias default 25.9.0"
              exit 1
            fi
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            echo "NVM loaded from $NVM_DIR/nvm.sh"

            echo "Using Node.js 25.9.0..."
            if ! nvm use 25.9.0; then
              echo "::error::ERROR: Node.js 25.9.0 is not installed in NVM."
              echo "FIX (one-time on EC2 — do NOT install during every deploy):"
              echo "  . \"\$HOME/.nvm/nvm.sh\""
              echo "  nvm install 25.9.0"
              echo "  nvm use 25.9.0"
              echo "  nvm alias default 25.9.0"
              exit 1
            fi

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v
            echo "Node location:"
            which node
            echo "NPM location:"
            which npm

            NODE_VERSION="$(node -v)"
            if [ "$NODE_VERSION" != "v25.9.0" ]; then
              echo "::error::ERROR: Incorrect Node.js version."
              echo "Expected: v25.9.0"
              echo "Found: $NODE_VERSION"
              exit 1
            fi

            # Shared helper for later steps (SSH is non-login; NVM must be loaded each time)
            tee /tmp/zylearn_use_node259.sh >/dev/null << 'NODE_EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM is not installed for the deployment user."
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            if ! nvm use 25.9.0; then
              echo "ERROR: Node.js 25.9.0 is unavailable in NVM."
              exit 1
            fi
            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v
            echo "Node location:"
            which node
            echo "NPM location:"
            which npm
            NODE_VERSION="$(node -v)"
            if [ "$NODE_VERSION" != "v25.9.0" ]; then
              echo "ERROR: Incorrect Node.js version."
              echo "Expected: v25.9.0"
              echo "Found: $NODE_VERSION"
              exit 1
            fi
            NODE_EOF
            sed -i 's/^[[:space:]]*//' /tmp/zylearn_use_node259.sh
            chmod 755 /tmp/zylearn_use_node259.sh
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            if ! command -v git >/dev/null 2>&1; then
              echo "::error::FAILED command: git --version"
              echo "FIX: sudo apt-get install -y git"
              exit 1
            fi
            echo "Git version: $(git --version)"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "::error::FAILED command: pm2 -v"
              echo "FIX under Node 25.9.0: npm install -g pm2"
              exit 1
            fi
            echo "PM2 version: $(pm2 -v)"
            echo "which pm2: $(which pm2)"
            echo "EC2 Node.js 25.9.0 tooling check OK"

      # ── 3) Application directory + package files ────────────────────────
      - name: Check application directory and package files
        id: check_app_dir
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check application directory"

            if [ -z "${APP_PATH}" ]; then
              echo "::error::FAILED: EC2_APP_PATH secret is empty"
              exit 1
            fi

            if [ ! -d "${APP_PATH}" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH"
              echo "FIX: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN (once)"
              exit 1
            fi

            if [ ! -f "${APP_PATH}/package.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package.json"
              exit 1
            fi

            if [ ! -f "${APP_PATH}/package-lock.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package-lock.json"
              echo "FIX: commit package-lock.json on main (required for npm ci)"
              exit 1
            fi

            if [ ! -d "${APP_PATH}/.git" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH/.git"
              exit 1
            fi

            ls -la "${APP_PATH}/package.json" "${APP_PATH}/package-lock.json"
            if [ -f "${APP_PATH}/.nvmrc" ]; then
              echo ".nvmrc:"
              cat "${APP_PATH}/.nvmrc"
            fi
            echo "Application directory check OK"

      # ── 4) Git pull latest main ─────────────────────────────────────────
      - name: Check Git status and pull latest main
        id: git_pull
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          envs: APP_PATH,GIT_SHA
          script: |
            set -e
            echo "STEP: Git fetch / reset"
            cd "${APP_PATH}"
            pwd
            whoami
            git status -sb
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Previous commit: ${PREV_SHA}"
            echo "Target GitHub commit: ${GIT_SHA}"

            echo "Fetching latest code..."
            if ! git fetch origin main; then
              echo "::error::FAILED command: git fetch origin main"
              echo "FIX: configure GitHub auth on EC2 (deploy key / SSH remote)."
              exit 1
            fi

            if ! git reset --hard origin/main; then
              echo "::error::FAILED command: git reset --hard origin/main"
              echo "FIX: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN"
              exit 1
            fi

            DEPLOY_SHA="$(git rev-parse HEAD)"
            echo "Now at commit: ${DEPLOY_SHA}"
            git status -sb
            echo "Git pull OK (tracked files only; gitignored .env* preserved)"

      # ── 5) npm ci ───────────────────────────────────────────────────────
      - name: npm ci
        id: npm_ci
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm ci"
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            cd "${APP_PATH}"
            pwd

            if [ ! -f package-lock.json ]; then
              echo "::error::FAILED: package-lock.json missing — refusing npm install fallback in production"
              exit 1
            fi

            echo "Installing dependencies..."
            if ! npm ci; then
              echo "::error::FAILED command: npm ci"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "npm ci OK — PM2 not restarted yet"

      # ── 6) npm run build ────────────────────────────────────────────────
      - name: npm run build
        id: npm_build
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm run build"
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            cd "${APP_PATH}"
            pwd

            echo "Building application..."
            if ! npm run build; then
              echo "::error::FAILED command: npm run build"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "Build completed successfully — PM2 not restarted yet"

      # ── 7) Check dist/ ──────────────────────────────────────────────────
      - name: Check dist directory
        id: check_dist
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check dist directory"
            cd "${APP_PATH}"

            if [ ! -d dist ]; then
              echo "::error::FAILED command: test -d dist"
              echo "PM2 was NOT restarted."
              exit 1
            fi

            if [ ! -f dist/index.html ]; then
              echo "::error::FAILED command: test -f dist/index.html"
              echo "PM2 was NOT restarted."
              exit 1
            fi

            ls -la dist | head -n 30
            echo "dist/ check OK — PM2 not restarted yet"

      # ── 8) Check PM2 process ────────────────────────────────────────────
      - name: Check PM2 process ZYLEARN
        id: check_pm2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check PM2 process"
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            echo "which pm2: $(which pm2)"
            pm2 -v
            pm2 status

            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "PM2 process ZYLEARN exists"
              pm2 describe ZYLEARN > /tmp/zylearn_pm2_precheck.txt
              sed -n '1,60p' /tmp/zylearn_pm2_precheck.txt
            else
              echo "PM2 process ZYLEARN does NOT exist yet"
              cd "${APP_PATH}"
              if [ -f ecosystem.config.cjs ] || [ -f ecosystem.config.js ]; then
                echo "ecosystem config found — start step will use it"
              else
                echo "::error::FAILED: PM2 process ZYLEARN missing and no ecosystem.config.js/.cjs"
                echo "FIX: start ZYLEARN once under Node 25.9.0 (nvm use 25.9.0), then re-run."
                exit 1
              fi
            fi
            echo "PM2 pre-check OK"

      # ── 9) pm2 restart (ONLY after successful build) ────────────────────
      - name: pm2 restart ZYLEARN
        id: pm2_restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 3m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: pm2 restart/start ZYLEARN"
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            cd "${APP_PATH}"

            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "Restarting PM2 application..."
              if ! pm2 restart ZYLEARN --update-env; then
                echo "::error::FAILED command: pm2 restart ZYLEARN --update-env"
                echo "FIX: pm2 logs ZYLEARN --lines 100"
                exit 1
              fi
            elif [ -f ecosystem.config.cjs ]; then
              echo "COMMAND: pm2 start ecosystem.config.cjs"
              pm2 start ecosystem.config.cjs
            elif [ -f ecosystem.config.js ]; then
              echo "COMMAND: pm2 start ecosystem.config.js"
              pm2 start ecosystem.config.js
            else
              echo "::error::FAILED: cannot restart/start ZYLEARN"
              exit 1
            fi
            echo "PM2 restart/start issued OK"

      # ── 10) Verify PM2 status ───────────────────────────────────────────
      - name: Verify PM2 status
        id: pm2_verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: Verify PM2 status"
            # shellcheck disable=SC1091
            . /tmp/zylearn_use_node259.sh

            sleep 3
            echo "PM2 status after restart..."
            # Do NOT pipe pm2 to head/monit — that causes EPIPE under Node 25 / appleboy script_stop
            pm2 status ZYLEARN
            pm2 describe ZYLEARN > /tmp/zylearn_pm2_describe.txt
            sed -n '1,80p' /tmp/zylearn_pm2_describe.txt

            echo "COMMAND: verify ZYLEARN is online"
            # Single-line node -p (multiline node -e breaks with appleboy script_stop injection)
            PM2_STATUS="$(pm2 jlist | node -p "const a=JSON.parse(require('fs').readFileSync(0,'utf8')).find(p=>p.name==='ZYLEARN'); if(!a){ process.stderr.write('ZYLEARN not found\\n'); process.exit(1);} a.pm2_env.status")"
            PM2_STATUS="$(printf '%s' "$PM2_STATUS" | tr -d '[:space:]')"
            echo "ZYLEARN status: ${PM2_STATUS}"

            if [ -z "$PM2_STATUS" ]; then
              echo "::error::FAILED: could not read PM2 status for ZYLEARN"
              echo "FIX: pm2 logs ZYLEARN --lines 100"
              exit 1
            fi

            if [ "$PM2_STATUS" != "online" ]; then
              echo "::error::FAILED command: verify pm2 status online for ZYLEARN"
              echo "Expected: online"
              echo "Found: ${PM2_STATUS}"
              echo "FIX: pm2 logs ZYLEARN --lines 100"
              echo "     curl -I http://127.0.0.1:3000"
              exit 1
            fi

            PM2_PID="$(pm2 pid ZYLEARN | tr -d '[:space:]')"
            echo "ZYLEARN pid: ${PM2_PID}"
            if [ -z "$PM2_PID" ] || [ "$PM2_PID" = "0" ]; then
              echo "::error::FAILED: ZYLEARN has no running PID"
              exit 1
            fi

            echo "Local health check:"
            if curl -I --max-time 5 http://127.0.0.1:3000; then
              echo "curl :3000 OK"
            else
              echo "WARN: curl to :3000 failed — check PM2 serve/preview is listening on 3000"
            fi

            echo "Deployment completed successfully (Node.js 25.9.0)."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## ZYLEARN deployment (Node.js 25.9.0)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target Node | \`25.9.0\` (NVM) |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Job status | \`${{ job.status }}\` |"
            echo "| SSH test | \`${{ steps.ssh_test.outcome }}\` |"
            echo "| Node 25.9.0 ensure | \`${{ steps.check_tools.outcome }}\` |"
            echo "| App dir check | \`${{ steps.check_app_dir.outcome }}\` |"
            echo "| Git pull | \`${{ steps.git_pull.outcome }}\` |"
            echo "| npm ci | \`${{ steps.npm_ci.outcome }}\` |"
            echo "| npm build | \`${{ steps.npm_build.outcome }}\` |"
            echo "| dist check | \`${{ steps.check_dist.outcome }}\` |"
            echo "| PM2 check | \`${{ steps.check_pm2.outcome }}\` |"
            echo "| PM2 restart | \`${{ steps.pm2_restart.outcome }}\` |"
            echo "| PM2 verify | \`${{ steps.pm2_verify.outcome }}\` |"
            echo ""
            echo "Secrets are never printed. Nginx/SSL were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
