name: Deploy to EC2

# Production deploy ONLY from main.
# Architecture: SSH to EC2 → build with Node 22 → pm2 restart ZYLEARN
# Pushing to develop (or any other branch) will NOT deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ZYLEARN to EC2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Validate required GitHub secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          set -euo pipefail
          missing=0
          check_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error title=Missing secret ${name}::Create repository secret '${name}' under Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "OK — secret '${name}' is configured (value hidden)."
            fi
          }
          check_secret "EC2_HOST" "${EC2_HOST}"
          check_secret "EC2_USER" "${EC2_USER}"
          check_secret "EC2_SSH_KEY" "${EC2_SSH_KEY}"
          check_secret "EC2_APP_PATH" "${EC2_APP_PATH}"
          if [ "$missing" -ne 0 ]; then
            echo "Fix: add the missing secrets, then re-run this workflow."
            exit 1
          fi

          echo "All required secrets are present. Continuing deployment..."

      - name: Checkout repository (for Node pin / npm cache)
        uses: actions/checkout@v4

      # Pin Node 22 on the GitHub runner (project standard). Build still runs on EC2.
      - name: Setup Node.js 22 (GitHub runner)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify GitHub runner Node.js 22
        run: |
          set -euo pipefail
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          node_major="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$node_major" != "22" ]; then
            echo "::error::ERROR: Node.js 22 is required on the GitHub runner. Found: $(node -v)"
            exit 1
          fi
          if [ -f .nvmrc ]; then
            echo ".nvmrc:"
            cat .nvmrc
          fi
          echo "GitHub runner Node.js 22 OK"

      # ── 1) SSH connection test ──────────────────────────────────────────
      - name: SSH connection test
        id: ssh_test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: SSH connection test"
            echo "COMMAND: whoami"
            whoami
            echo "COMMAND: hostname"
            hostname
            echo "COMMAND: date -u"
            date -u
            echo "SSH connection OK"

      # ── 2) Ensure + verify Node.js 22 on EC2 ────────────────────────────
      - name: Ensure Node.js 22 on EC2
        id: check_tools
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            echo "STEP: Ensure Node.js 22 on EC2"
            echo "COMMAND: whoami && pwd"
            whoami
            pwd

            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "::error::FAILED: nvm not found at $HOME/.nvm"
              echo "FIX (one-time on EC2 as ubuntu):"
              echo "  curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash"
              echo "  # then re-run this workflow"
              exit 1
            fi
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            echo "Loaded nvm from $NVM_DIR/nvm.sh"

            echo "COMMAND: nvm install 22 (if needed) && nvm use 22 && nvm alias default 22"
            nvm install 22
            nvm use 22
            nvm alias default 22

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v

            node_major="$(node -p "process.versions.node.split('.')[0]")"
            if [ "$node_major" != "22" ]; then
              echo "::error::ERROR: Node.js 22 is required. Found: $(node -v)"
              echo "FIX: nvm install 22 && nvm use 22 && nvm alias default 22"
              exit 1
            fi

            echo "COMMAND: git --version"
            if ! command -v git >/dev/null 2>&1; then
              echo "::error::FAILED command: git --version"
              echo "FIX: sudo apt-get install -y git"
              exit 1
            fi
            git --version

            echo "COMMAND: pm2 -v"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "::error::FAILED command: pm2 -v"
              echo "FIX (under Node 22): npm install -g pm2"
              exit 1
            fi
            pm2 -v
            echo "which node: $(command -v node)"
            echo "which pm2: $(command -v pm2)"
            echo "EC2 Node.js 22 tooling check OK"

      # ── 3) Application directory + package files ────────────────────────
      - name: Check application directory and package files
        id: check_app_dir
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check application directory"

            if [ -z "${APP_PATH}" ]; then
              echo "::error::FAILED: EC2_APP_PATH secret is empty"
              echo "FIX: Set GitHub secret EC2_APP_PATH=/var/www/ZYLEARN"
              exit 1
            fi

            echo "COMMAND: test -d \"\$APP_PATH\""
            if [ ! -d "${APP_PATH}" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH"
              echo "FIX: Create/clone the app on EC2, then: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN"
              exit 1
            fi

            echo "COMMAND: test -f \"\$APP_PATH/package.json\""
            if [ ! -f "${APP_PATH}/package.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package.json"
              exit 1
            fi

            echo "COMMAND: test -f \"\$APP_PATH/package-lock.json\""
            if [ ! -f "${APP_PATH}/package-lock.json" ]; then
              echo "::error::FAILED command: test -f \$APP_PATH/package-lock.json"
              exit 1
            fi

            echo "COMMAND: test -d \"\$APP_PATH/.git\""
            if [ ! -d "${APP_PATH}/.git" ]; then
              echo "::error::FAILED command: test -d \$APP_PATH/.git"
              exit 1
            fi

            ls -la "${APP_PATH}/package.json" "${APP_PATH}/package-lock.json"
            if [ -f "${APP_PATH}/.nvmrc" ]; then
              echo ".nvmrc contents:"
              cat "${APP_PATH}/.nvmrc"
            fi
            echo "Application directory check OK"

      # ── 4) Git status + pull latest main ────────────────────────────────
      - name: Check Git status and pull latest main
        id: git_pull
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          envs: APP_PATH,GIT_SHA
          script: |
            set -e
            echo "STEP: Git fetch / reset"
            cd "${APP_PATH}"
            pwd
            whoami
            git status -sb
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Previous commit: ${PREV_SHA}"
            echo "Target GitHub commit: ${GIT_SHA}"

            echo "COMMAND: git fetch origin main"
            if ! git fetch origin main; then
              echo "::error::FAILED command: git fetch origin main"
              echo "FIX: Configure GitHub auth on EC2 (deploy key / SSH remote)."
              exit 1
            fi

            echo "COMMAND: git reset --hard origin/main"
            if ! git reset --hard origin/main; then
              echo "::error::FAILED command: git reset --hard origin/main"
              echo "FIX: sudo chown -R ubuntu:ubuntu /var/www/ZYLEARN"
              exit 1
            fi

            DEPLOY_SHA="$(git rev-parse HEAD)"
            echo "Now at commit: ${DEPLOY_SHA}"
            git status -sb
            echo "${PREV_SHA}" > /tmp/zylearn_prev_sha
            echo "${DEPLOY_SHA}" > /tmp/zylearn_deploy_sha
            echo "Git pull OK"

      # ── 5) npm ci (Node 22) ─────────────────────────────────────────────
      - name: npm ci
        id: npm_ci
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm ci"
            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v
            node_major="$(node -p "process.versions.node.split('.')[0]")"
            if [ "$node_major" != "22" ]; then
              echo "::error::ERROR: Node.js 22 is required before npm ci. Found: $(node -v)"
              exit 1
            fi

            cd "${APP_PATH}"
            pwd

            echo "COMMAND: npm ci"
            if ! npm ci; then
              echo "::error::FAILED command: npm ci"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "npm ci OK — PM2 not restarted yet"

      # ── 6) npm run build (Node 22) ──────────────────────────────────────
      - name: npm run build
        id: npm_build
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: npm run build"
            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v
            node_major="$(node -p "process.versions.node.split('.')[0]")"
            if [ "$node_major" != "22" ]; then
              echo "::error::ERROR: Node.js 22 is required before npm run build. Found: $(node -v)"
              exit 1
            fi

            cd "${APP_PATH}"
            pwd

            echo "COMMAND: npm run build"
            if ! npm run build; then
              echo "::error::FAILED command: npm run build"
              echo "PM2 was NOT restarted."
              exit 1
            fi
            echo "npm run build OK — PM2 not restarted yet"

      # ── 7) Check dist/ ──────────────────────────────────────────────────
      - name: Check dist directory
        id: check_dist
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check dist directory"
            cd "${APP_PATH}"

            echo "COMMAND: test -d dist"
            if [ ! -d dist ]; then
              echo "::error::FAILED command: test -d dist"
              echo "PM2 was NOT restarted."
              exit 1
            fi

            echo "COMMAND: test -f dist/index.html"
            if [ ! -f dist/index.html ]; then
              echo "::error::FAILED command: test -f dist/index.html"
              echo "PM2 was NOT restarted."
              exit 1
            fi

            ls -la dist | head -n 30
            echo "dist/ check OK — PM2 not restarted yet"

      # ── 8) Check PM2 process ────────────────────────────────────────────
      - name: Check PM2 process ZYLEARN
        id: check_pm2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: Check PM2 process"
            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "Node version:"
            node -v
            echo "which pm2: $(command -v pm2)"
            pm2 -v
            pm2 status

            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "PM2 process ZYLEARN exists"
              pm2 describe ZYLEARN | head -n 50
            else
              echo "PM2 process ZYLEARN does NOT exist yet"
              cd "${APP_PATH}"
              if [ -f ecosystem.config.cjs ] || [ -f ecosystem.config.js ]; then
                echo "ecosystem config found — start step will use it"
              else
                echo "::error::FAILED: PM2 process ZYLEARN missing and no ecosystem.config.js/.cjs"
                echo "FIX: start ZYLEARN once under Node 22, then re-run."
                exit 1
              fi
            fi
            echo "PM2 pre-check OK"

      # ── 9) pm2 restart (ONLY after successful build) ────────────────────
      - name: pm2 restart ZYLEARN
        id: pm2_restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 3m
          envs: APP_PATH
          script: |
            set -e
            echo "STEP: pm2 restart/start ZYLEARN"
            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "Node version:"
            node -v
            node_major="$(node -p "process.versions.node.split('.')[0]")"
            if [ "$node_major" != "22" ]; then
              echo "::error::ERROR: Node.js 22 is required before pm2 restart. Found: $(node -v)"
              exit 1
            fi

            cd "${APP_PATH}"

            if pm2 describe ZYLEARN >/dev/null 2>&1; then
              echo "COMMAND: pm2 restart ZYLEARN --update-env"
              if ! pm2 restart ZYLEARN --update-env; then
                echo "::error::FAILED command: pm2 restart ZYLEARN --update-env"
                exit 1
              fi
            elif [ -f ecosystem.config.cjs ]; then
              echo "COMMAND: pm2 start ecosystem.config.cjs"
              pm2 start ecosystem.config.cjs
            elif [ -f ecosystem.config.js ]; then
              echo "COMMAND: pm2 start ecosystem.config.js"
              pm2 start ecosystem.config.js
            else
              echo "::error::FAILED: cannot restart/start ZYLEARN"
              exit 1
            fi
            echo "PM2 restart/start issued OK"

      # ── 10) Verify PM2 status + Node 22 interpreter ─────────────────────
      - name: Verify PM2 status
        id: pm2_verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "STEP: Verify PM2 status"
            export NVM_DIR="$HOME/.nvm"
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            echo "Node version:"
            node -v
            echo "NPM version:"
            npm -v

            sleep 3
            echo "COMMAND: pm2 status ZYLEARN"
            pm2 status ZYLEARN

            echo "COMMAND: verify online + node interpreter"
            if ! pm2 jlist | node -e '
              const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const app = data.find((p) => p.name === "ZYLEARN");
              if (!app) {
                console.error("FAILED: ZYLEARN not found in pm2 jlist");
                process.exit(1);
              }
              const status = app.pm2_env && app.pm2_env.status;
              const exec = (app.pm2_env && (app.pm2_env.exec_interpreter || app.pm2_env.exec_path)) || "";
              console.log("ZYLEARN status:", status);
              console.log("ZYLEARN exec_interpreter/path:", exec);
              if (status !== "online") {
                console.error("FAILED: expected status online, got:", status);
                process.exit(1);
              }
            '; then
              echo "::error::FAILED command: verify pm2 status online for ZYLEARN"
              echo "FIX: pm2 logs ZYLEARN --lines 100"
              exit 1
            fi

            echo "Deployment completed successfully (Node.js 22)."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## ZYLEARN deployment (Node.js 22)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target Node | \`22\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Job status | \`${{ job.status }}\` |"
            echo "| SSH test | \`${{ steps.ssh_test.outcome }}\` |"
            echo "| Node 22 ensure | \`${{ steps.check_tools.outcome }}\` |"
            echo "| App dir check | \`${{ steps.check_app_dir.outcome }}\` |"
            echo "| Git pull | \`${{ steps.git_pull.outcome }}\` |"
            echo "| npm ci | \`${{ steps.npm_ci.outcome }}\` |"
            echo "| npm build | \`${{ steps.npm_build.outcome }}\` |"
            echo "| dist check | \`${{ steps.check_dist.outcome }}\` |"
            echo "| PM2 check | \`${{ steps.check_pm2.outcome }}\` |"
            echo "| PM2 restart | \`${{ steps.pm2_restart.outcome }}\` |"
            echo "| PM2 verify | \`${{ steps.pm2_verify.outcome }}\` |"
            echo ""
            echo "Secrets are never printed."
          } >> "$GITHUB_STEP_SUMMARY"
